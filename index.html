<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoramento de Rodovias via Satélite</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-green: #1a472a;
      --dark-gray: #2d3748;
      --light-gray: #e2e8f0;
      --accent-green: #2d5a3c;
    }

    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--dark-gray);
    }
    
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    .header {
      color: white;
      margin-bottom: 1rem;
      padding: 1rem;
      background-color: var(--dark-green);
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .header-subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .map-container {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 1rem;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    #map { 
      width: 100%; 
      height: 100%; 
      border-radius: 8px;
      overflow: hidden;
    }

    #controls {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--dark-green);
      color: white;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      backdrop-filter: blur(10px);
      max-width: 90%;
      width: auto;
      transition: all 0.3s ease;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0 0.8rem;
      border-right: 2px solid rgba(255,255,255,0.2);
    }

    .control-group:last-child {
      border-right: none;
    }

    .speed-label {
      font-size: 0.9rem;
      white-space: nowrap;
    }

    #speedRange {
      width: 80px;
      accent-color: #4a9e5f;
    }

    #playPauseBtn {
      width: 36px;
      padding: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #playPauseBtn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    button {
      padding: 0.6rem 1rem;
      cursor: pointer;
      border: none;
      background-color: var(--accent-green);
      color: white;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
    }

    button:hover:not(:disabled) {
      background-color: #3d704f;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      background-color: #4a5568;
    }

    #dateSelect {
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--light-gray);
      font-family: inherit;
      min-width: 140px;
      background-color: white;
      cursor: pointer;
      font-size: 0.9rem;
    }

    #opacityControl {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0 0.5rem;
      border-left: 2px solid rgba(255,255,255,0.2);
    }

    #opacityRange {
      width: 100px;
      accent-color: #4a9e5f;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      display: none;
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #selectedDateDisplay {
      font-weight: 600;
      color: white;
      min-width: 120px;
      text-align: center;
      background: var(--accent-green);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 2px solid var(--dark-green);
    }

    .leaflet-popup-content {
      margin: 0.8rem 1rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      #controls {
        flex-direction: column;
        gap: 0.8rem;
        top: auto;
        bottom: 20px;
        width: calc(100% - 40px);
        padding: 0.8rem;
      }

      #opacityControl {
        border-left: none;
        border-top: 2px solid rgba(255,255,255,0.2);
        padding-top: 0.8rem;
        width: 100%;
        justify-content: center;
      }

      .control-group {
        border-right: none;
        border-bottom: 2px solid rgba(255,255,255,0.2);
        width: 100%;
        justify-content: center;
        padding: 0.8rem 0;
      }

      .control-group:last-child {
        border-bottom: none;
      }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 2000;
      display: none;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .leaflet-image-layer {
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div>
        <h1>Monitoramento de Rodovias via Satélite</h1>
        <div class="header-subtitle">Análise de crescimento de vegetação ciliar e defeitos no asfalto.</div>
      </div>
    </header>
    <div class="map-container">
      <div id="controls">
        <button id="prevBtn" title="Data anterior">&lt;</button>
        <label for="dateSelect">Data:</label>
        <select id="dateSelect"></select>
        <span id="selectedDateDisplay"></span>
        <button id="nextBtn" title="Próxima data">&gt;</button>
        <div id="opacityControl">
          <label for="opacityRange">Opacidade:</label>
          <input type="range" id="opacityRange" min="0" max="1" step="0.1" value="1" />
        </div>
        <div class="control-group">
          <button id="playPauseBtn" title="Play/Pause">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="speed-label">Velocidade:</div>
          <input type="range" id="speedRange" min="1" max="15" step="1" value="5" title="Velocidade da animação">
        </div>
        <div id="loading">
          <div class="loading-spinner"></div>
        </div>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const imgDir = './images';
    const imgSizeMeters = 2560;
    let map, markers = [], overlays = [], allDates = [];
    let currentOverlays = [];
    let nextOverlays = [];
    let imageCache = new Map();
    const dateSelect = document.getElementById('dateSelect');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const opacityRange = document.getElementById('opacityRange');
    const loadingIndicator = document.getElementById('loading');
    const selectedDateDisplay = document.getElementById('selectedDateDisplay');
    let isPlaying = false;
    let animationInterval;
    const playPauseBtn = document.getElementById('playPauseBtn');
    const speedRange = document.getElementById('speedRange');

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        if (imageCache.has(url)) {
          resolve(imageCache.get(url));
          return;
        }
        const img = new Image();
        img.onload = () => {
          imageCache.set(url, img);
          resolve(img);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function updateButtonStates() {
      const currentIndex = allDates.indexOf(dateSelect.value);
      prevBtn.disabled = currentIndex <= 0;
      nextBtn.disabled = currentIndex >= allDates.length - 1;
      selectedDateDisplay.textContent = dateSelect.value;
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        startAnimation();
      } else {
        playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        stopAnimation();
      }
    }

    function startAnimation() {
      if (animationInterval) clearInterval(animationInterval);
      const intervalTime = 1600 - (speedRange.value * 100);
      animationInterval = setInterval(() => {
        const currentIndex = allDates.indexOf(dateSelect.value);
        const nextIndex = (currentIndex + 1) % allDates.length;
        dateSelect.value = allDates[nextIndex];
        const event = new Event('change');
        dateSelect.dispatchEvent(event);
      }, intervalTime);
    }

    function stopAnimation() {
      if (animationInterval) {
        clearInterval(animationInterval);
        animationInterval = null;
      }
    }

    function init(metadata) {
      const allPoints = Object.values(metadata).map(p => [p.lat, p.lng]);
      map = L.map('map').fitBounds(allPoints);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const dateSet = new Set();
      Object.values(metadata).forEach(p => p.dates.forEach(d => dateSet.add(d)));
      allDates = Array.from(dateSet).sort();
      allDates.forEach(d => {
        const opt = document.createElement('option'); opt.value = d; opt.text = d;
        dateSelect.appendChild(opt);
      });

      prevBtn.addEventListener('click', () => {
        if (isPlaying) {
          togglePlayPause();
        }
        const idx = allDates.indexOf(dateSelect.value);
        if (idx > 0) {
          dateSelect.value = allDates[idx - 1];
          dateSelect.dispatchEvent(new Event('change'));
        }
      });
      nextBtn.addEventListener('click', () => {
        if (isPlaying) {
          togglePlayPause();
        }
        const idx = allDates.indexOf(dateSelect.value);
        if (idx < allDates.length - 1) {
          dateSelect.value = allDates[idx + 1];
          dateSelect.dispatchEvent(new Event('change'));
        }
      });
      opacityRange.addEventListener('input', () => {
        const newOpacity = opacityRange.value;
        overlays.forEach(o => o.setOpacity(newOpacity));
      });

      playPauseBtn.addEventListener('click', togglePlayPause);
      speedRange.addEventListener('change', () => {
        if (isPlaying) {
          startAnimation();
        }
      });

      dateSelect.addEventListener('change', () => {
        updateButtonStates();
        updateAll(metadata, dateSelect.value);
      });

      dateSelect.addEventListener('click', () => {
        if (isPlaying) {
          togglePlayPause();
        }
      });

      if (allDates.length > 0) {
        dateSelect.value = allDates[0];
        updateButtonStates();
        updateAll(metadata, dateSelect.value);
      } else {
        console.warn("No dates found in metadata.");
        loadingIndicator.style.display = 'none';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      }
    }

    async function updateAll(metadata, selectedDate) {
      loadingIndicator.style.display = 'block';
      
      const selTime = new Date(selectedDate);
      const opacity = opacityRange.value;
      
      nextOverlays = [];
      const loadPromises = [];

      try {
        await Promise.all(Object.entries(metadata).map(async ([pid, p]) => {
          if (!p.dates || p.dates.length === 0) {
            console.warn(`Point ${pid} has no dates.`);
            return;
          }

          let closestDate = p.dates.reduce((prev, curr) => {
            return Math.abs(new Date(curr) - selTime) < Math.abs(new Date(prev) - selTime) ? curr : prev;
          }, p.dates[0]);

          const { lat, lng } = p;
          const halfSide = imgSizeMeters / 2;
          const deltaLat = halfSide / 111320;
          const deltaLng = halfSide / (111320 * Math.cos(lat * Math.PI / 180));
          const sw = [lat - deltaLat, lng - deltaLng];
          const ne = [lat + deltaLat, lng + deltaLng];

          if (markers[pid]) {
            markers[pid].setLatLng([lat, lng]);
            markers[pid].getPopup().setContent(`Point ID: ${pid}<br>Image Date: ${closestDate}`);
          } else {
            const marker = L.circleMarker([lat, lng], { radius: 4, color: '#00f' }).addTo(map);
            marker.bindPopup(`Point ID: ${pid}<br>Image Date: ${closestDate}`);
            markers[pid] = marker;
          }

          const imageUrl = `${imgDir}/point_${pid}_${closestDate}.jpg`;
          
          try {
            await preloadImage(imageUrl);
            const overlay = L.imageOverlay(imageUrl, [sw, ne], {
              opacity: 0,
              errorOverlayUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
            }).addTo(map);
            
            nextOverlays.push(overlay);
          } catch (err) {
            console.error(`Failed to load image: ${imageUrl}`, err);
          }
        }));

        currentOverlays.forEach(overlay => {
          overlay.setOpacity(0);
          setTimeout(() => map.removeLayer(overlay), 300);
        });

        nextOverlays.forEach(overlay => {
          setTimeout(() => overlay.setOpacity(opacity), 50);
        });

        currentOverlays = nextOverlays;
      } catch (error) {
        console.error('Error updating overlays:', error);
      }

      loadingIndicator.style.display = 'none';
    }

    fetch('manifest.json')
      .then(resp => { if (!resp.ok) throw new Error('manifest.json not found or fetch failed'); return resp.json(); })
      .then(init)
      .catch(err => {
        console.error('Failed to initialize map:', err);
        alert(`Error loading map data: ${err.message}. Please check manifest.json and network connection.`);
        loadingIndicator.style.display = 'none';
      });
  </script>
</body>
</html>
